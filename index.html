<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSE Digital Report System</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #e5e7eb; }
        .no-print { display: block; }
        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef } = React;

        // Custom Icon Component (Using SVGs for 100% reliability)
        const Icon = ({ name, size = 20 }) => {
            const icons = {
                map: <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>,
                truck: <path d="M1 3h15v13H1zM16 8h4l3 3v5h-7V8z"></path>,
                alert: <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
            };
            return (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    {icons[name] || <circle cx="12" cy="12" r="10"></circle>}
                </svg>
            );
        };

        const App = () => {
            const reportRef = useRef(null);
            const [isPreview, setIsPreview] = useState(false);
            const [rawText, setRawText] = useState('');
            const [formData, setFormData] = useState({
                kejadian: { lokasi: '', tarikh: '', masa: '', perihalan: '' },
                lori: { noPlat: '', model: '' }
            });

            const handleAutoFill = () => {
                const lokasiMatch = rawText.match(/Lokasi:\s*(.*)/i);
                const platMatch = rawText.match(/No\. Pendaftaran:\s*(.*)/i);
                setFormData({
                    ...formData,
                    kejadian: { ...formData.kejadian, lokasi: lokasiMatch ? lokasiMatch[1] : '' },
                    lori: { ...formData.lori, noPlat: platMatch ? platMatch[1] : '' }
                });
            };

            if (isPreview) {
                return (
                    <div className="min-h-screen bg-gray-200 p-8 flex flex-col items-center">
                        <div className="fixed top-4 bg-white/80 backdrop-blur p-4 rounded-2xl shadow-xl flex gap-4 no-print">
                            <button onClick={() => setIsPreview(false)} className="px-6 py-2 bg-gray-800 text-white rounded-xl font-bold">Kembali</button>
                            <button onClick={() => html2pdf().from(reportRef.current).save()} className="px-6 py-2 bg-red-600 text-white rounded-xl font-bold">Download PDF</button>
                        </div>
                        <div ref={reportRef} className="bg-white p-12 shadow-2xl w-[210mm] mt-16 border">
                            <div className="text-center border-b-4 border-black pb-4 mb-8">
                                <h1 className="text-3xl font-black uppercase">Laporan Siasatan Kemalangan</h1>
                                <p className="text-red-600 font-bold">JABATAN HSE</p>
                            </div>
                            <div className="grid grid-cols-2 gap-8 text-sm">
                                <div className="border-2 border-black p-4">
                                    <h3 className="font-black bg-black text-white px-2 py-1 mb-3 inline-block">1. BUTIRAN KEJADIAN</h3>
                                    <p><strong>LOKASI:</strong> {formData.kejadian.lokasi}</p>
                                    <p><strong>RINGKASAN:</strong> {formData.kejadian.perihalan}</p>
                                </div>
                                <div className="border-2 border-black p-4">
                                    <h3 className="font-black bg-black text-white px-2 py-1 mb-3 inline-block">2. KENDERAAN</h3>
                                    <p><strong>NO PLAT:</strong> {formData.lori.noPlat}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="max-w-2xl mx-auto my-10 bg-white rounded-[2.5rem] shadow-2xl overflow-hidden border">
                    <div className="bg-gradient-to-r from-red-800 to-black p-12 text-white">
                        <h1 className="text-4xl font-black tracking-tighter">HSE DIGITAL REPORT</h1>
                        <p className="opacity-60 uppercase text-xs tracking-widest mt-2">Internal Management System v3.3</p>
                    </div>

                    <div className="p-10 space-y-10">
                        {/* Smart Fill Section */}
                        <section className="bg-red-50 p-6 rounded-3xl border-2 border-red-100">
                            <h2 className="text-red-800 font-black text-xs uppercase mb-4 flex items-center gap-2">
                                <Icon name="alert" /> Pengisian Pantas (Smart Fill)
                            </h2>
                            <textarea 
                                className="w-full p-4 rounded-2xl border-2 border-red-200 outline-none mb-4" 
                                rows="3" 
                                placeholder="Paste message here..."
                                value={rawText}
                                onChange={(e) => setRawText(e.target.value)}
                            />
                            <button onClick={handleAutoFill} className="w-full bg-black text-white py-3 rounded-xl font-bold text-xs uppercase tracking-widest">Auto-Fill Form</button>
                        </section>

                        <div className="grid grid-cols-1 gap-8">
                            <div>
                                <label className="text-[10px] font-black text-gray-400 uppercase tracking-widest block mb-2">Lokasi Kejadian</label>
                                <input 
                                    className="w-full p-4 bg-gray-50 border-2 border-gray-100 rounded-2xl focus:border-red-500 outline-none transition-all" 
                                    value={formData.kejadian.lokasi}
                                    onChange={(e) => setFormData({...formData, kejadian: {...formData.kejadian, lokasi: e.target.value}})}
                                />
                            </div>
                            <div>
                                <label className="text-[10px] font-black text-gray-400 uppercase tracking-widest block mb-2">No. Plat Lori</label>
                                <input 
                                    className="w-full p-4 bg-gray-50 border-2 border-gray-100 rounded-2xl focus:border-red-500 outline-none transition-all" 
                                    value={formData.lori.noPlat}
                                    onChange={(e) => setFormData({...formData, lori: {...formData.lori, noPlat: e.target.value}})}
                                />
                            </div>
                        </div>

                        <button 
                            onClick={() => setIsPreview(true)}
                            className="w-full bg-red-600 text-white py-6 rounded-3xl font-black text-xl shadow-2xl hover:bg-red-700 transition-all active:scale-95 border-b-8 border-red-900"
                        >
                            JANA & PREVIEW LAPORAN
                        </button>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
