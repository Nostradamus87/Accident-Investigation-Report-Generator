<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSE Digital Report System</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #e5e7eb; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        @media print {
            @page { size: A4; margin: 10mm; }
            body { background: white !important; margin: 0; padding: 0 !important; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // Accessing icons from the global Lucide object
        const { 
            Camera, Plus, Trash2, Download, FileText, CheckCircle, 
            Truck, User, MapPin, AlertTriangle, Wand2, ClipboardList, 
            Users, Printer, FileDown 
        } = lucideReact;

        const { useState, useRef, useEffect } = React;

        const App = () => {
            const reportRef = useRef(null);
            const [formData, setFormData] = useState({
                kejadian: { jenisKemalangan: 'Jalan Raya', tarikh: '', masa: '', lokasi: '', perihalan: '' },
                mangsaSaksi: { 
                    namaMangsa: '', noKPMangsa: '', umurMangsa: '', pengalamanKerja: '', keterukanKecederaan: 'Tiada kecederaan',
                    namaSaksi: '', noKPSaksi: '', umurSaksi: '', noTelSaksi: '',
                    namaPihakLain: '', noKPPihakLain: '', umurPihakLain: '', noTelPihakLain: '',
                    keterukanKecederaanPihakLain: 'Tiada kecederaan', maklumatTambahanPihakLain: ''
                },
                lori: { noPendaftaran: '', jenamaModel: '', jenisLori: '', kelajuanTerakhir: '', nomborDO: '', muatanMT: '', pemandu: '', syarikat: '' },
                punca: {
                    pihak: { pekerjaSyarikat: false, kontraktor: false, pihakKetiga: false },
                    faktor: { latihan: false, sop: false, peralatan: false, ppe: false, keletihan: false, persekitaran: false, lainLain: '' }
                },
                tindakan: [{ id: Date.now(), perihal: '', tarikhSelesai: '', pegawai: '', status: '' }],
                gambar: []
            });

            const [rawText, setRawText] = useState('');
            const [isPreview, setIsPreview] = useState(false);
            const [isGenerating, setIsGenerating] = useState(false);

            // ... [I have kept your logic exactly the same as you provided] ...
            
            const handleAutoFill = () => {
                if (!rawText.trim()) return;
                const extract = (regex) => {
                    const match = rawText.match(regex);
                    return match ? match[1].trim() : null;
                };
                const newValues = { ...formData };
                const tarikhRaw = extract(/Tarikh:\s*(.*)/i);
                if (tarikhRaw) {
                    const months = { januari: '01', februari: '02', mac: '03', april: '04', mei: '05', jun: '06', julai: '07', ogos: '08', september: '09', oktober: '10', november: '11', disember: '12' };
                    const parts = tarikhRaw.split(' ');
                    if (parts.length >= 3) {
                        const day = parts[0].padStart(2, '0');
                        const month = months[parts[1].toLowerCase()];
                        const year = parts[2];
                        if (month) newValues.kejadian.tarikh = `${year}-${month}-${day}`;
                    }
                }
                const lokasi = extract(/Lokasi:\s*(.*)/i);
                if (lokasi) newValues.kejadian.lokasi = lokasi;
                setFormData(newValues);
            };

            const handleNestedChange = (section, field, value) => {
                setFormData(prev => ({ ...prev, [section]: { ...prev[section], [field]: value } }));
            };

            const downloadPDF = () => {
                if (!window.html2pdf) return;
                setIsGenerating(true);
                const element = reportRef.current;
                const opt = {
                    margin: 10,
                    filename: `Laporan_Kemalangan_${formData.lori.noPendaftaran || 'HSE'}.pdf`,
                    image: { type: 'jpeg', quality: 1.0 },
                    html2canvas: { scale: 2, useCORS: true },
                    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
                };
                window.html2pdf().set(opt).from(element).save().then(() => setIsGenerating(false));
            };

            // Section Header Component
            const SectionHeader = ({ icon: Icon, title }) => (
                <div className="flex items-center gap-2 mb-2 border-b pb-1 text-red-700">
                    <Icon size={16} />
                    <h2 className="font-bold uppercase tracking-wide text-xs">{title}</h2>
                </div>
            );

            const inputClass = "w-full p-3 border-2 border-neutral-100 rounded-xl outline-none text-sm font-normal transition-all focus:border-red-500 bg-white text-neutral-800";
            const labelStyle = "text-[11px] font-black text-neutral-400 uppercase tracking-widest ml-1";

            if (isPreview) {
                return (
                    <div className="min-h-screen bg-neutral-200 flex flex-col items-center p-4">
                        <div className="fixed top-4 z-50 bg-white p-3 rounded-2xl shadow-xl flex gap-4 no-print">
                            <button onClick={() => setIsPreview(false)} className="px-4 py-2 bg-neutral-100 rounded-lg font-bold">← Back</button>
                            <button onClick={downloadPDF} className="px-4 py-2 bg-red-600 text-white rounded-lg font-bold">Download PDF</button>
                        </div>
                        <div className="mt-20 bg-white p-10 shadow-2xl" ref={reportRef} style={{ width: '190mm' }}>
                            <h1 className="text-2xl font-black text-center uppercase">Laporan Siasatan Kemalangan</h1>
                            <p className="text-center text-red-600 font-bold mb-8">JABATAN HSE</p>
                            <div className="grid grid-cols-2 gap-4">
                                <div className="border p-4">
                                    <h3 className="font-bold border-b mb-2">1. BUTIRAN KEJADIAN</h3>
                                    <p>Tarikh: {formData.kejadian.tarikh}</p>
                                    <p>Lokasi: {formData.kejadian.lokasi}</p>
                                </div>
                                <div className="border p-4">
                                    <h3 className="font-bold border-b mb-2">2. KENDERAAN</h3>
                                    <p>No Plat: {formData.lori.noPendaftaran}</p>
                                </div>
                            </div>
                            <div className="mt-10 italic">Report generated on {new Date().toLocaleDateString()}</div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="max-w-3xl mx-auto my-10 bg-white rounded-3xl shadow-2xl overflow-hidden border border-neutral-200">
                    <div className="bg-red-700 p-10 text-white">
                        <h1 className="text-3xl font-black uppercase">Digital HSE Report</h1>
                        <p className="opacity-80">Borang Siasatan Kemalangan Dalaman</p>
                    </div>
                    <div className="p-10 space-y-10">
                        <section className="bg-red-50 p-6 rounded-2xl border-2 border-red-100">
                            <label className="block mb-2 font-bold text-red-800">SMART FILL (Paste message here)</label>
                            <textarea className="w-full p-4 rounded-xl border-2 border-red-200 mb-4" rows="4" value={rawText} onChange={(e) => setRawText(e.target.value)} />
                            <button onClick={handleAutoFill} className="w-full bg-black text-white p-4 rounded-xl font-bold uppercase tracking-widest text-xs">Auto-Fill Form</button>
                        </section>
                        
                        <section>
                            <SectionHeader icon={MapPin} title="1. Maklumat Kejadian" />
                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className={labelStyle}>Tarikh</label>
                                    <input type="date" className={inputClass} value={formData.kejadian.tarikh} onChange={(e) => handleNestedChange('kejadian', 'tarikh', e.target.value)} />
                                </div>
                                <div>
                                    <label className={labelStyle}>Lokasi</label>
                                    <input className={inputClass} value={formData.kejadian.lokasi} onChange={(e) => handleNestedChange('kejadian', 'lokasi', e.target.value)} />
                                </div>
                            </div>
                        </section>

                        <section>
                            <SectionHeader icon={Truck} title="2. Maklumat Kenderaan" />
                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className={labelStyle}>No. Pendaftaran</label>
                                    <input className={inputClass} value={formData.lori.noPendaftaran} onChange={(e) => handleNestedChange('lori', 'noPendaftaran', e.target.value)} />
                                </div>
                            </div>
                        </section>

                        <button onClick={() => setIsPreview(true)} className="w-full bg-red-600 text-white py-6 rounded-2xl font-black text-lg shadow-xl hover:bg-red-700 transition-all">GENERATE & PREVIEW REPORT</button>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
