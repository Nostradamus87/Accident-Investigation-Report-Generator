<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Laporan HSE Digital</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        @media print {
            @page { size: A4; margin: 10mm; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        /**
         * FIX: Custom Icon Component
         * This solves the 'forwardRef' and 'lucideReact is undefined' errors.
         * It uses the standard Lucide library to render icons safely.
         */
        const LucideIcon = ({ name, size = 18, className = "" }) => {
            const iconRef = useRef(null);

            useEffect(() => {
                // This triggers Lucide to find the <i> tag and replace it with an SVG
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [name]);

            return (
                <i 
                    data-lucide={name} 
                    style={{ width: size, height: size }} 
                    className={`inline-block ${className}`}
                ></i>
            );
        };

        const App = () => {
          const reportRef = useRef(null);
          const [formData, setFormData] = useState({
            kejadian: { jenisKemalangan: 'Jalan Raya', tarikh: '', masa: '', lokasi: '', perihalan: '' },
            mangsaSaksi: { 
              namaMangsa: '', noKPMangsa: '', umurMangsa: '', pengalamanKerja: '', keterukanKecederaan: 'Tiada kecederaan',
              namaSaksi: '', noKPSaksi: '', umurSaksi: '', noTelSaksi: '',
              namaPihakLain: '', noKPPihakLain: '', umurPihakLain: '', noTelPihakLain: '',
              keterukanKecederaanPihakLain: 'Tiada kecederaan', maklumatTambahanPihakLain: ''
            },
            lori: { noPendaftaran: '', jenamaModel: '', jenisLori: '', kelajuanTerakhir: '', nomborDO: '', muatanMT: '', pemandu: '', syarikat: '' },
            punca: {
              pihak: { pekerjaSyarikat: false, kontraktor: false, pihakKetiga: false },
              faktor: { latihan: false, sop: false, peralatan: false, ppe: false, keletihan: false, persekitaran: false, lainLain: '' }
            },
            tindakan: [{ id: Date.now(), perihal: '', tarikhSelesai: '', pegawai: '', status: '' }],
            gambar: []
          });

          const [rawText, setRawText] = useState('');
          const [isPreview, setIsPreview] = useState(false);
          const [isGenerating, setIsGenerating] = useState(false);

          const handleAutoFill = () => {
            if (!rawText.trim()) return;
            const extract = (regex) => {
              const match = rawText.match(regex);
              return match ? match[1].trim() : null;
            };
            const newValues = { ...formData };
            const lokasi = extract(/Lokasi:\s*(.*)/i);
            if (lokasi) newValues.kejadian.lokasi = lokasi;
            const noPlat = extract(/No\. Pendaftaran:\s*(.*)/i);
            if (noPlat) newValues.lori.noPendaftaran = noPlat;
            setFormData(newValues);
          };

          const handleNestedChange = (section, field, value) => {
            setFormData(prev => ({ ...prev, [section]: { ...prev[section], [field]: value } }));
          };

          const downloadPDF = () => {
            setIsGenerating(true);
            const element = reportRef.current;
            html2pdf().from(element).save(`HSE_Report_${formData.lori.noPendaftaran}.pdf`).then(() => setIsGenerating(false));
          };

          if (isPreview) {
            return (
              <div className="min-h-screen bg-neutral-200 p-8 flex flex-col items-center">
                <div className="fixed top-4 bg-white/90 backdrop-blur p-4 rounded-2xl shadow-xl flex gap-4 no-print z-50">
                  <button onClick={() => setIsPreview(false)} className="px-6 py-2 bg-neutral-100 rounded-xl font-bold">← Edit</button>
                  <button onClick={downloadPDF} className="px-6 py-2 bg-red-600 text-white rounded-xl font-bold">Download PDF</button>
                </div>
                <div ref={reportRef} className="bg-white p-12 shadow-2xl w-[210mm] mt-20 border">
                  <h1 className="text-2xl font-black text-center uppercase border-b-4 border-black pb-2 mb-4">Laporan Siasatan Kemalangan</h1>
                  <p><strong>Lokasi:</strong> {formData.kejadian.lokasi}</p>
                  <p><strong>No Plat:</strong> {formData.lori.noPendaftaran}</p>
                </div>
              </div>
            );
          }

          return (
            <div className="max-w-3xl mx-auto my-10 bg-white rounded-[2.5rem] shadow-2xl overflow-hidden border">
              <div className="bg-gradient-to-br from-red-800 to-black p-10 text-white">
                <h1 className="text-4xl font-black tracking-tighter uppercase leading-none">Laporan Siasatan Kemalangan</h1>
                <p className="opacity-60 text-xs mt-3 uppercase tracking-widest">HSE Digital Internal System</p>
              </div>

              <div className="p-10 space-y-12">
                <section className="bg-red-50 p-8 rounded-[2rem] border-2 border-red-100 shadow-inner">
                  <div className="flex items-center gap-2 mb-4 text-red-900 font-black text-xs uppercase tracking-widest">
                    <LucideIcon name="wand-2" /> Smart Fill
                  </div>
                  <textarea className="w-full p-4 rounded-2xl border-2 border-red-200 outline-none mb-4 text-sm" rows="3" value={rawText} onChange={(e) => setRawText(e.target.value)} />
                  <button onClick={handleAutoFill} className="w-full bg-black text-white py-4 rounded-xl font-bold text-xs uppercase tracking-widest">Auto-Isi Borang</button>
                </section>

                <section>
                    <div className="flex items-center gap-2 mb-4 border-b pb-2 text-red-700">
                        <LucideIcon name="map-pin" />
                        <h2 className="font-bold uppercase text-xs tracking-widest">1. Maklumat Kejadian</h2>
                    </div>
                    <input 
                        className="w-full p-4 bg-gray-50 border-2 rounded-2xl outline-none focus:border-red-500" 
                        placeholder="Lokasi Kejadian"
                        value={formData.kejadian.lokasi}
                        onChange={(e) => handleNestedChange('kejadian', 'lokasi', e.target.value)}
                    />
                </section>

                <button 
                  onClick={() => { window.scrollTo(0,0); setIsPreview(true); }}
                  className="w-full bg-red-600 text-white py-6 rounded-3xl font-black text-xl shadow-2xl hover:bg-red-700 transition-all border-b-8 border-red-900"
                >
                  JANA & PREVIEW LAPORAN
                </button>
              </div>
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
