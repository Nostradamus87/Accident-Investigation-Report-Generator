<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSE Report Tool</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // This tells the browser to use the Lucide Icons from the web
        const { 
            Camera, Plus, Trash2, Download, FileText, CheckCircle, 
            Truck, User, MapPin, AlertTriangle, Wand2, ClipboardList, 
            Users, Printer, FileDown 
        } = lucide;

        const { useState, useRef, useEffect } = React;

        const App = () => {
            const reportRef = useRef(null);
            const [isPreview, setIsPreview] = useState(false);
            const [formData, setFormData] = useState({
                kejadian: { jenisKemalangan: 'Jalan Raya', tarikh: '', masa: '', lokasi: '', perihalan: '' },
                mangsaSaksi: { namaMangsa: '', noKPMangsa: '', keterukanKecederaan: 'Tiada kecederaan' },
                lori: { noPendaftaran: '', jenamaModel: '' },
                punca: { pihak: {}, faktor: {} },
                tindakan: [{ id: Date.now(), perihal: '', status: '' }],
                gambar: []
            });

            // Simplified PDF function for testing
            const downloadPDF = () => {
                const element = reportRef.current;
                html2pdf().from(element).save('Laporan_HSE.pdf');
            };

            const SectionHeader = ({ icon: Icon, title }) => (
                <div className="flex items-center gap-2 mb-4 border-b pb-2 text-red-700">
                    <Icon size={18} />
                    <h2 className="font-bold uppercase text-sm">{title}</h2>
                </div>
            );

            if (isPreview) {
                return (
                    <div className="p-8 bg-neutral-100 min-h-screen flex flex-col items-center">
                        <div className="bg-white p-10 shadow-xl mb-4" ref={reportRef} style={{ width: '210mm' }}>
                            <h1 className="text-2xl font-black text-center text-red-700">LAPORAN KEMALANGAN HSE</h1>
                            <hr className="my-4 border-2 border-black" />
                            <p><strong>Lokasi:</strong> {formData.kejadian.lokasi}</p>
                            <p><strong>No Plat:</strong> {formData.lori.noPendaftaran}</p>
                        </div>
                        <div className="flex gap-4">
                            <button onClick={() => setIsPreview(false)} className="bg-gray-500 text-white px-6 py-2 rounded-lg font-bold">Back</button>
                            <button onClick={downloadPDF} className="bg-red-600 text-white px-6 py-2 rounded-lg font-bold">Save as PDF</button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="max-w-2xl mx-auto my-10 bg-white shadow-2xl rounded-3xl overflow-hidden border">
                    <div className="bg-red-700 p-8 text-white">
                        <h1 className="text-2xl font-black uppercase">HSE Report Generator</h1>
                        <p className="opacity-70">Fill in the details for your client</p>
                    </div>
                    
                    <div className="p-8 space-y-8">
                        <section>
                            <SectionHeader icon={MapPin} title="1. Butiran Kejadian" />
                            <input 
                                className="w-full p-3 border-2 rounded-xl mb-4" 
                                placeholder="Lokasi Kejadian"
                                onChange={(e) => setFormData({...formData, kejadian: {...formData.kejadian, lokasi: e.target.value}})}
                            />
                        </section>

                        <section>
                            <SectionHeader icon={Truck} title="2. Butiran Lori" />
                            <input 
                                className="w-full p-3 border-2 rounded-xl" 
                                placeholder="No Pendaftaran (Plat)"
                                onChange={(e) => setFormData({...formData, lori: {...formData.lori, noPendaftaran: e.target.value}})}
                            />
                        </section>

                        <button 
                            onClick={() => setIsPreview(true)}
                            className="w-full bg-red-600 text-white py-4 rounded-2xl font-black hover:bg-red-700 shadow-lg transition-all"
                        >
                            JANA LAPORAN PDF
                        </button>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
