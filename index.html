<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSE Report System</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .app-loading { display: flex; justify-content: center; align-items: center; height: 100vh; font-weight: bold; color: #666; }
    </style>
</head>
<body>
    <div id="root">
        <div class="app-loading">System Loading... (If this stays, check Console)</div>
    </div>

    <script type="text/babel">
        // Using built-in SVGs instead of Lucide to prevent "lucide is not defined" errors
        const Icons = {
            MapPin: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>,
            Truck: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="1" y="3" width="15" height="13"></rect><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon><circle cx="5.5" cy="18.5" r="2.5"></circle><circle cx="18.5" cy="18.5" r="2.5"></circle></svg>
        };

        const { useState, useRef } = React;

        const App = () => {
            const reportRef = useRef(null);
            const [isPreview, setIsPreview] = useState(false);
            const [formData, setFormData] = useState({
                lokasi: '',
                noPlat: ''
            });

            const generatePDF = () => {
                const element = reportRef.current;
                html2pdf().from(element).save(`HSE_Report_${formData.noPlat || 'New'}.pdf`);
            };

            if (isPreview) {
                return (
                    <div className="min-h-screen p-6 flex flex-col items-center">
                        <div ref={reportRef} className="bg-white p-12 shadow-2xl w-[210mm] min-h-[297mm] border border-gray-300">
                            <h1 className="text-3xl font-black text-center text-red-700 uppercase">Laporan HSE</h1>
                            <div className="h-1 bg-black my-6"></div>
                            <div className="space-y-6 text-xl">
                                <p><strong>Lokasi:</strong> {formData.lokasi || '---'}</p>
                                <p><strong>No Plat:</strong> {formData.noPlat || '---'}</p>
                            </div>
                        </div>
                        <div className="mt-8 flex gap-4">
                            <button onClick={() => setIsPreview(false)} className="bg-gray-700 text-white px-8 py-3 rounded-xl font-bold">KEMBALI</button>
                            <button onClick={generatePDF} className="bg-red-600 text-white px-8 py-3 rounded-xl font-bold">MUAT TURUN PDF</button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="max-w-md mx-auto my-12 bg-white rounded-3xl shadow-2xl border border-gray-100 overflow-hidden">
                    <div className="bg-red-700 p-8 text-white">
                        <h1 className="text-2xl font-black uppercase">Report Tool</h1>
                        <p className="opacity-70">HSE Digital System</p>
                    </div>

                    <div className="p-8 space-y-6">
                        <div>
                            <label className="flex items-center gap-2 text-xs font-bold text-gray-400 uppercase mb-2"><Icons.MapPin /> Lokasi Kejadian</label>
                            <input 
                                className="w-full p-4 bg-gray-50 border rounded-2xl focus:border-red-500 outline-none" 
                                placeholder="Cth: Simpang Ampat"
                                value={formData.lokasi}
                                onChange={(e) => setFormData({...formData, lokasi: e.target.value})}
                            />
                        </div>

                        <div>
                            <label className="flex items-center gap-2 text-xs font-bold text-gray-400 uppercase mb-2"><Icons.Truck /> No Plat Lori</label>
                            <input 
                                className="w-full p-4 bg-gray-50 border rounded-2xl focus:border-red-500 outline-none" 
                                placeholder="Cth: ABC 1234"
                                value={formData.noPlat}
                                onChange={(e) => setFormData({...formData, noPlat: e.target.value})}
                            />
                        </div>

                        <button 
                            onClick={() => setIsPreview(true)}
                            className="w-full bg-red-600 text-white py-5 rounded-2xl font-black text-lg hover:bg-red-700 transition-all shadow-lg active:scale-95"
                        >
                            JANA LAPORAN
                        </button>
                    </div>
                </div>
            );
        };

        // Standard React 18 Mounting
        try {
            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);
        } catch (err) {
            document.getElementById('root').innerHTML = `<div style="color:red; padding:20px;">Mounting Error: ${err.message}</div>`;
        }
    </script>
</body>
</html>
