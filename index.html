<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Laporan HSE Digital</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        @media print {
            @page { size: A4; margin: 10mm; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        // Custom Component for Icons
        const Icon = ({ name, size = 18, className = "" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} style={{width: size, height: size}} className={className}></i>;
        };

        const App = () => {
            const reportRef = useRef(null);
            const [isPreview, setIsPreview] = useState(false);
            const [rawText, setRawText] = useState('');
            const [isGenerating, setIsGenerating] = useState(false);
            
            // FULL ORIGINAL STATE
            const [formData, setFormData] = useState({
                kejadian: { jenisKemalangan: 'Jalan Raya', tarikh: '', masa: '', lokasi: '', perihalan: '' },
                mangsaSaksi: { 
                    namaMangsa: '', noKPMangsa: '', umurMangsa: '', pengalamanKerja: '', keterukanKecederaan: 'Tiada kecederaan',
                    namaSaksi: '', noKPSaksi: '', umurSaksi: '', noTelSaksi: '',
                    namaPihakLain: '', noKPPihakLain: '', umurPihakLain: '', noTelPihakLain: '',
                    keterukanKecederaanPihakLain: 'Tiada kecederaan', maklumatTambahanPihakLain: ''
                },
                lori: { noPendaftaran: '', jenamaModel: '', jenisLori: '', kelajuanTerakhir: '', nomborDO: '', muatanMT: '', pemandu: '', syarikat: '' },
                punca: {
                    pihak: { pekerjaSyarikat: false, kontraktor: false, pihakKetiga: false },
                    faktor: { latihan: false, sop: false, peralatan: false, ppe: false, keletihan: false, persekitaran: false, lainLain: '' }
                },
                tindakan: [{ id: Date.now(), perihal: '', tarikhSelesai: '', pegawai: '', status: '' }],
                gambar: []
            });

            // ORIGINAL AUTO-FILL LOGIC
            const handleAutoFill = () => {
                if (!rawText.trim()) return;
                const extract = (regex) => {
                    const match = rawText.match(regex);
                    return match ? match[1].trim() : null;
                };
                const newValues = { ...formData };
                
                const lokasi = extract(/Lokasi:\s*(.*)/i);
                if (lokasi) newValues.kejadian.lokasi = lokasi;
                const noPlat = extract(/No\. Pendaftaran:\s*(.*)/i);
                if (noPlat) newValues.lori.noPendaftaran = noPlat;
                const pemandu = extract(/Nama Pemandu:\s*(.*)/i);
                if (pemandu) { 
                    newValues.lori.pemandu = pemandu; 
                    newValues.mangsaSaksi.namaMangsa = pemandu; 
                }
                
                setFormData(newValues);
                alert("Data Berjaya Diisi!");
            };

            const handleNestedChange = (section, field, value) => {
                setFormData(prev => ({ ...prev, [section]: { ...prev[section], [field]: value } }));
            };

            const handlePuncaCheckboxChange = (subSection, field) => {
                setFormData(prev => ({ 
                    ...prev, 
                    punca: { ...prev.punca, [subSection]: { ...prev.punca[subSection], [field]: !prev.punca[subSection][field] } } 
                }));
            };

            const downloadPDF = () => {
                setIsGenerating(true);
                const element = reportRef.current;
                const opt = {
                    margin: 10,
                    filename: `Laporan_HSE_${formData.lori.noPendaftaran}.pdf`,
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { scale: 2, useCORS: true },
                    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
                };
                html2pdf().set(opt).from(element).save().then(() => setIsGenerating(false));
            };

            const SectionHeader = ({ icon, title }) => (
                <div className="flex items-center gap-2 mb-4 border-b pb-2 text-red-700">
                    <Icon name={icon} size={18} />
                    <h2 className="font-bold uppercase text-xs tracking-widest">{title}</h2>
                </div>
            );

            const inputClass = "w-full p-3 border-2 border-gray-100 rounded-xl outline-none text-sm transition-all focus:border-red-500 bg-white";

            // PREVIEW MODE
            if (isPreview) {
                return (
                    <div className="min-h-screen bg-gray-200 p-4 md:p-8 flex flex-col items-center">
                        <div className="fixed top-4 bg-white/90 backdrop-blur p-4 rounded-2xl shadow-2xl flex gap-4 no-print z-50">
                            <button onClick={() => setIsPreview(false)} className="px-6 py-2 bg-gray-100 rounded-xl font-bold">← Edit Data</button>
                            <button onClick={downloadPDF} className="px-6 py-2 bg-red-600 text-white rounded-xl font-bold">Muat Turun PDF</button>
                        </div>
                        
                        <div ref={reportRef} className="bg-white p-[15mm] shadow-2xl w-[210mm] min-h-[297mm] mt-20 border border-gray-300">
                            <div className="text-center border-b-4 border-black pb-4 mb-8">
                                <h1 className="text-3xl font-black uppercase tracking-tighter">Laporan Siasatan Kemalangan</h1>
                                <p className="text-red-600 font-bold uppercase tracking-widest text-[10px]">Jabatan Keselamatan & Kesihatan Pekerjaan (HSE)</p>
                            </div>

                            <div className="grid grid-cols-2 gap-4 mb-6">
                                <div className="border-2 border-black p-4">
                                    <h3 className="font-black bg-black text-white px-2 py-0.5 text-[10px] inline-block mb-3 uppercase">1. Butiran Kejadian</h3>
                                    <p className="text-[11px]"><strong>Tarikh:</strong> {formData.kejadian.tarikh}</p>
                                    <p className="text-[11px]"><strong>Lokasi:</strong> {formData.kejadian.lokasi}</p>
                                    <p className="text-[11px] mt-2 italic">"{formData.kejadian.perihalan}"</p>
                                </div>
                                <div className="border-2 border-black p-4">
                                    <h3 className="font-black bg-black text-white px-2 py-0.5 text-[10px] inline-block mb-3 uppercase">2. Butiran Kenderaan</h3>
                                    <p className="text-[11px]"><strong>No. Plat:</strong> {formData.lori.noPendaftaran}</p>
                                    <p className="text-[11px]"><strong>Pemandu:</strong> {formData.lori.pemandu}</p>
                                </div>
                            </div>

                            <div className="border-2 border-black p-4 mb-6">
                                <h3 className="font-black bg-black text-white px-2 py-0.5 text-[10px] inline-block mb-3 uppercase">3. Maklumat Mangsa</h3>
                                <div className="grid grid-cols-2 text-[11px]">
                                    <p><strong>Nama:</strong> {formData.mangsaSaksi.namaMangsa}</p>
                                    <p><strong>Kecederaan:</strong> <span className="text-red-600 font-bold uppercase">{formData.mangsaSaksi.keterukanKecederaan}</span></p>
                                </div>
                            </div>

                            <div className="mt-auto pt-20 flex justify-between px-10">
                                <div className="text-center">
                                    <div className="border-t border-black border-dotted w-40 mb-1"></div>
                                    <p className="text-[9px] font-bold">Disediakan Oleh</p>
                                </div>
                                <div className="text-center">
                                    <div className="border-t border-black border-dotted w-40 mb-1"></div>
                                    <p className="text-[9px] font-bold">Disahkan Oleh</p>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            // FORM MODE
            return (
                <div className="max-w-3xl mx-auto my-10 bg-white rounded-[2.5rem] shadow-2xl overflow-hidden border">
                    <div className="bg-gradient-to-br from-red-800 to-black p-12 text-white">
                        <h1 className="text-4xl font-black tracking-tighter uppercase leading-none">Laporan Siasatan Kemalangan</h1>
                        <p className="opacity-60 text-xs mt-3 uppercase tracking-[0.3em]">HSE Digital Internal System</p>
                    </div>

                    <div className="p-10 space-y-12">
                        {/* SMART FILL */}
                        <section className="bg-red-50 p-8 rounded-[2rem] border-2 border-red-100 shadow-inner">
                            <div className="flex items-center gap-2 mb-4 text-red-900 font-black text-xs uppercase tracking-widest">
                                <Icon name="wand-2" /> Pengisian Pantas (Smart Fill)
                            </div>
                            <textarea 
                                className="w-full p-4 rounded-2xl border-2 border-red-200 outline-none mb-4 text-sm" 
                                rows="3" 
                                placeholder="Tampal mesej di sini..."
                                value={rawText}
                                onChange={(e) => setRawText(e.target.value)}
                            />
                            <button onClick={handleAutoFill} className="w-full bg-black text-white py-4 rounded-xl font-bold text-xs uppercase tracking-widest hover:bg-gray-800 transition-all">Auto-Isi Borang</button>
                        </section>

                        {/* SECTION 1 */}
                        <section>
                            <SectionHeader icon="map-pin" title="1. Maklumat Kejadian" />
                            <div className="grid grid-cols-2 gap-4">
                                <div className="col-span-2">
                                    <label className="text-[10px] font-bold text-gray-400 uppercase mb-1 block">Lokasi Kejadian</label>
                                    <input className={inputClass} value={formData.kejadian.lokasi} onChange={(e) => handleNestedChange('kejadian', 'lokasi', e.target.value)} />
                                </div>
                                <div>
                                    <label className="text-[10px] font-bold text-gray-400 uppercase mb-1 block">Tarikh</label>
                                    <input type="date" className={inputClass} value={formData.kejadian.tarikh} onChange={(e) => handleNestedChange('kejadian', 'tarikh', e.target.value)} />
                                </div>
                                <div>
                                    <label className="text-[10px] font-bold text-gray-400 uppercase mb-1 block">Masa</label>
                                    <input type="time" className={inputClass} value={formData.kejadian.masa} onChange={(e) => handleNestedChange('kejadian', 'masa', e.target.value)} />
                                </div>
                                <div className="col-span-2">
                                    <label className="text-[10px] font-bold text-gray-400 uppercase mb-1 block">Ringkasan Kejadian</label>
                                    <textarea className={inputClass} rows="3" value={formData.kejadian.perihalan} onChange={(e) => handleNestedChange('kejadian', 'perihalan', e.target.value)} />
                                </div>
                            </div>
                        </section>

                        {/* SECTION 2 */}
                        <section>
                            <SectionHeader icon="user" title="2. Maklumat Mangsa" />
                            <div className="grid grid-cols-2 gap-4">
                                <input placeholder="Nama Penuh" className={inputClass} value={formData.mangsaSaksi.namaMangsa} onChange={(e) => handleNestedChange('mangsaSaksi', 'namaMangsa', e.target.value)} />
                                <input placeholder="No. KP" className={inputClass} value={formData.mangsaSaksi.noKPMangsa} onChange={(e) => handleNestedChange('mangsaSaksi', 'noKPMangsa', e.target.value)} />
                                <div className="col-span-2">
                                    <select className={inputClass} value={formData.mangsaSaksi.keterukanKecederaan} onChange={(e) => handleNestedChange('mangsaSaksi', 'keterukanKecederaan', e.target.value)}>
                                        <option>Tiada kecederaan</option>
                                        <option>First Aid</option>
                                        <option>Lost Time Injury (LTI)</option>
                                        <option>Fatality</option>
                                    </select>
                                </div>
                            </div>
                        </section>

                        {/* SECTION 3 */}
                        <section>
                            <SectionHeader icon="truck" title="3. Maklumat Kenderaan" />
                            <div className="grid grid-cols-2 gap-4">
                                <input placeholder="No. Plat" className={inputClass} value={formData.lori.noPendaftaran} onChange={(e) => handleNestedChange('lori', 'noPendaftaran', e.target.value)} />
                                <input placeholder="Nama Pemandu" className={inputClass} value={formData.lori.pemandu} onChange={(e) => handleNestedChange('lori', 'pemandu', e.target.value)} />
                            </div>
                        </section>

                        {/* FINAL BUTTON */}
                        <button 
                            onClick={() => { window.scrollTo(0,0); setIsPreview(true); }}
                            className="w-full bg-red-600 text-white py-6 rounded-3xl font-black text-xl shadow-2xl hover:bg-red-700 transition-all active:scale-95 border-b-8 border-red-900"
                        >
                            JANA & PREVIEW LAPORAN
                        </button>
                    </div>
                    <footer className="bg-gray-900 p-8 text-center text-gray-500 text-[10px] font-bold tracking-[0.3em] uppercase">
                        © 2026 Internal HSE Management System
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
